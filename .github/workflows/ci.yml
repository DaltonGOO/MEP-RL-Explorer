name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run still in flight for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duct_rl/web/crate
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: duct_rl/web/crate

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  python:
    name: Python env (3D routing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: duct_rl/web/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r duct_rl/web/backend/requirements.txt

      # Includes SB3's check_env, which validates the observation space
      # against what the env actually emits.
      - name: Environment smoke tests
        run: python test_env3d.py
        working-directory: duct_rl/python

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duct_rl/web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: duct_rl/web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build
